<div class="container" *ngIf="user">
  <!-- Header -->
  <div class="daily-status-page-header">
    <div class="daily-status-page-header-top">
      <mat-icon class="status-icon">update</mat-icon>
      <h1 class="daily-status-page-title">Daily Status</h1>
    </div>
    <div class="daily-status-page-divider"></div>
  </div>
  
  <!-- Main Card -->
  <mat-card class="daily-status-card" fxFlex="100">
    <mat-card-content>
      <div class="daily-status-card-header-row">
        <div class="daily-status-card-header">Run Report</div>
        <button
          *ngIf="realUser==user"
          mat-raised-button
          class="filled add-report-btn"
          (click)="addReport()"
          data-testid="header_add_report">
          Add Report
        </button>
      </div>
      <div class="daily-status-card-divider"></div>
      <!-- Date Range -->
      <mat-form-field *ngIf="!mobileView" class="users-right-buffer users-form-size small-input date-range-field" appearance="outline">
        <mat-label>Date Range Start</mat-label>
        <input matInput [matDatepicker]="picker" [(ngModel)]="startRange" (dateChange)="dateRangeChange()" data-testid="start_range"/>
        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
        <mat-hint>MM/DD/YYYY</mat-hint>
      </mat-form-field>
      <mat-form-field *ngIf="!mobileView" class="users-right-buffer users-form-size small-input date-range-field" appearance="outline">
        <mat-label>Date Range End</mat-label>
        <input matInput [matDatepicker]="picker1" [(ngModel)]="endRange" (dateChange)="dateRangeChange()" data-testid="end_range"/>
        <mat-datepicker-toggle matIconSuffix [for]="picker1"></mat-datepicker-toggle>
        <mat-datepicker #picker1></mat-datepicker>
        <mat-hint>MM/DD/YYYY</mat-hint>
      </mat-form-field>
      <button *ngIf="!mobileView" mat-raised-button class="filled update-range-btn" [disabled]="!dateRangeValid()" (click)="updateRange()" data-testid="update_range">Update Range</button>
      <button *ngIf="!mobileView" mat-raised-button class="filled run-report-btn" [disabled]="!dateRangeValid()" (click)="customReport()" data-testid="update_range" [color]="datesChanged ? 'primary' : ''" 
      matTooltip="This will send you an email of this user's DSUs in the date range you have selected.">Run Report</button>
      <button *ngIf="mobileView" mat-raised-button class="filled mobile-update-range-btn" (click)="openDateRangeModal()" data-testid="date_range">Update Range</button>
      <!-- Table -->
      <div class="daily-status-table-wrap">
        <table mat-table [dataSource]="dataSource">
          <ng-container matColumnDef="date">
            <th mat-header-cell *matHeaderCellDef>Date</th>
            <td mat-cell *matCellDef="let element">{{ element.date }}</td>
          </ng-container>
          <ng-container matColumnDef="projects">
            <th mat-header-cell *matHeaderCellDef>Project ID(s)</th>
            <td mat-cell *matCellDef="let element">{{ element.projectNames.join(", ") }}</td>
          </ng-container>
          <ng-container matColumnDef="reportStatus">
            <th mat-header-cell *matHeaderCellDef>Submitted</th>
            <td mat-cell *matCellDef="let element">
              <p>{{ element.status }}</p>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let element; columns: displayedColumns" (click)="viewReport(element)"></tr>
          <tr *matNoDataRow class="mat-mdc-row no-data-row">
            <td class="mat-mdc-cell no-data-cell" [attr.colspan]="displayedColumns.length">
              <div class="no-data-content">
                <img class="no-data-image" width="200" height="200" alt="EMPTY" src="../../../assets/RisenOneCat.gif" />
                <div class="no-data-title">No Reports Found</div>
                <div class="no-data-subtitle">Add your first report to get started</div>
                <button
                  *ngIf="realUser==user"
                  mat-raised-button
                  class="filled no-data-add-btn"
                  (click)="addReport()"
                  data-testid="no_data_add_report">
                  Add Report
                </button>
              </div>
            </td>
          </tr>
        </table>
        <!-- Pagin options -->
        <mat-paginator class="paginator" [pageSize]="pageSize" [pageIndex]="pageNumber" [pageSizeOptions]="[5, 10, 25]"></mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>

    <mat-card class="daily-status-card" fxFlex="100">
      <mat-card-content>
        <div class="daily-status-card-header">Email Monthly Reports</div>
        <div class="daily-status-card-divider"></div>
        <div class="tableButtons">
          <button mat-raised-button class="filled" [routerLink]="'/team/team-daily-status'" *ngIf="role=='LEAD'"
            data-testid="return_lead">Return to Overview</button>
          <button mat-raised-button class="filled" [routerLink]="'/admin/admin-daily-status'" *ngIf="role=='ADMIN'"
            data-testid="return_admin">Return to Overview</button>
          <button mat-raised-button class="filled" [routerLink]="'/pm/pm-daily-status'" *ngIf="role=='PM'"
            data-testid="return_admin">Return to Overview</button>
        </div>
        <div class="monthly-report-buttons">
          <button mat-raised-button class="filled monthly-report-btn" (click)="monthly('current')">Current Monthly Report</button>
          <button mat-raised-button class="filled monthly-report-btn" (click)="monthly('prev')">Previous Monthly Report</button>
        </div>
      </mat-card-content>
    </mat-card>
</div>
