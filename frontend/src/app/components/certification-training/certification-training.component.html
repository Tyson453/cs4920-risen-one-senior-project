<div class="cert-container">
  <div class="cert-page-header">
    <div class="cert-page-header-top">
      <mat-icon class="cert-icon">verified</mat-icon>
      <h1 class="cert-page-title">Certification & Training</h1>
      <div class="title-inline-divider" aria-hidden="true"></div>
      <p class="subtitle">View and manage your certifications and completed training.</p>
    </div>
    <div class="cert-page-divider"></div>
  </div>

  <div class="card">
    <div class="cert-toolbar">
      <div class="search-field">
        <mat-icon class="search-icon">search</mat-icon>
        <input type="text" placeholder="Search certifications or training..." />
      </div>

      <button type="button" class="primary-btn">
        <mat-icon class="btn-icon">add</mat-icon>
        Add
      </button>
    </div>

    <div class="cert-list">
      <div class="cert-item">
        <div class="cert-item-left">
          <div class="cert-badge">
            <mat-icon>workspace_premium</mat-icon>
          </div>
          <div class="cert-meta">
            <div class="cert-name">AWS Certification</div>
            <div class="cert-sub">Certification • Active</div>
          </div>
        </div>
        <button type="button" class="ghost-btn">View</button>
      </div>

      <div class="cert-item">
        <div class="cert-item-left">
          <div class="cert-badge">
            <mat-icon>school</mat-icon>
          </div>
          <div class="cert-meta">
            <div class="cert-name">Angular Training</div>
            <div class="cert-sub">Course • Completed</div>
          </div>
        </div>
        <button type="button" class="ghost-btn">View</button>
      </div>

      <div class="cert-item">
        <div class="cert-item-left">
          <div class="cert-badge">
            <mat-icon>security</mat-icon>
          </div>
          <div class="cert-meta">
            <div class="cert-name">Security Awareness</div>
            <div class="cert-sub">Course • Due soon</div>
          </div>
        </div>
        <button type="button" class="ghost-btn">View</button>
      </div>
    </div>
  </div>
</div>
