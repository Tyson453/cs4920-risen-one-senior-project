<app-auth-shell pageTitle="Forgot Password" pageSubtitle="Enter your username to receive a recovery code.">
  <!-- Step 1: Request code -->
  <form *ngIf="step === 'request'" class="auth-form" [formGroup]="usernameForm" (ngSubmit)="onRequestCode()">
    <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>

    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Username</mat-label>
      <input matInput type="text" formControlName="username" autocomplete="username" />
      <mat-error *ngIf="usernameForm.get('username')?.hasError('required')">Required</mat-error>
    </mat-form-field>

    <button mat-raised-button type="submit" class="primary-button" [disabled]="loading">
      {{ loading ? 'Sending...' : 'Send recovery code' }}
    </button>

    <button mat-button type="button" class="back-link" (click)="onBackToLogin()">
      Back to login
    </button>
  </form>

  <!-- Step 2: Enter code -->
  <form *ngIf="step === 'verify'" class="auth-form" [formGroup]="codeForm" (ngSubmit)="onVerifyCode()">
    <p class="success-message" *ngIf="successMessage">{{ successMessage }}</p>
    <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>

    <mat-form-field appearance="outline" class="form-field">
      <mat-label>6-digit recovery code</mat-label>
      <input matInput type="text" formControlName="code" maxlength="6" autocomplete="one-time-code" />
      <mat-error *ngIf="codeForm.get('code')?.hasError('required')">Required</mat-error>
      <mat-error *ngIf="codeForm.get('code')?.hasError('pattern')">Must be exactly 6 digits</mat-error>
    </mat-form-field>

    <button mat-raised-button type="submit" class="primary-button">
      Continue
    </button>

    <button mat-button type="button" class="back-link" (click)="onBackToLogin()">
      Back to login
    </button>
  </form>
</app-auth-shell>
