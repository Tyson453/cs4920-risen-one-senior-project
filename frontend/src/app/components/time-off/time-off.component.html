<div class="timeoff-container">
  <div class="timeoff-page-header">
    <div class="timeoff-page-header-top">
      <mat-icon class="time-off-icon">beach_access</mat-icon>
      <h1 class="timeoff-page-title">
        Request Time Off
      </h1>
      <div class="title-inline-divider" aria-hidden="true"></div>
      <p class="subtitle">Submit a request for vacation or leave.</p>
    </div>
    <div class="timeoff-page-divider"></div>
  </div>

  <div class="card">
    <div class="row">
      <div class="field">
        <label>Start Date</label>
        <input 
          type="date"
          class="start"
          [min]="today"
          [max]="endDate || null"
          [(ngModel)]="startDate" 
          (change)="onStartChange()"
        />
      </div>

      <div class="field">
        <label>End Date</label>
        <input 
          type="date"
          class="end"
          [min]="startDate || today"
          [(ngModel)]="endDate"
          (change)="onEndChange()"
        />
      </div>
    </div>

    <div class="field">
      <label>Reason</label>
      <textarea rows="3" placeholder="Optional"></textarea>
    </div>

    <button type="button" class="primary-btn">Submit Request</button>
  </div>
</div>
