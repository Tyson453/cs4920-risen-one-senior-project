<div class="game-page">
  <div class="game-top-actions">
    <button mat-raised-button color="primary" routerLink="/how-to-play">
      How to Play
    </button>
  </div>

  <h1>Game Portal</h1>
  <p>Game coming soon...</p>

  <button mat-raised-button color="accent">Start Game</button>

  <div class="stats">

  <div class="leaderboard">

    <p>1. Player1 - 100</p>
