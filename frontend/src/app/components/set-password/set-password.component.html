<div class="set-password-container">
  <h1>Set your password</h1>
  <p class="subtitle">Please choose a new password for your account.</p>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>New password</mat-label>
      <input matInput type="password" formControlName="newPassword" autocomplete="new-password" />
      <mat-error *ngIf="form.get('newPassword')?.hasError('required')">Required</mat-error>
      <mat-error *ngIf="form.get('newPassword')?.hasError('minlength')">At least 8 characters</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Confirm password</mat-label>
      <input matInput type="password" formControlName="confirmPassword" autocomplete="new-password" />
      <mat-error *ngIf="form.get('confirmPassword')?.hasError('required')">Required</mat-error>
    </mat-form-field>

    <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>

    <button mat-raised-button color="primary" type="submit" [disabled]="loading">
      {{ loading ? 'Updating…' : 'Set password' }}
    </button>
  </form>
</div>
