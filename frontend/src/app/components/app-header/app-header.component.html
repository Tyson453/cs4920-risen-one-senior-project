<div class="header-container">
  <img
    id="roc-logo"
    class="roc-logo"
    alt="risen one consulting logo"
    [routerLink]="'/home'"
  />

  <h3 class="header-text montserrat">
    Risen One Consulting Employee Portal
  </h3>

  <div class="header-right">
    <div class="account-section" #accountSection>
      <button
        type="button"
        class="account-trigger verticle-alignment-helper"
        aria-label="Open account panel"
        (click)="toggleAccountCard($event)">
        <mat-icon class="account-logo">account_circle</mat-icon>
      </button>

      <div class="account-card" *ngIf="showAccountCard">

        <div class="account-card-header">
          <img
            class="account-card-logo roc-logo"
            alt="Risen One logo"
          />
          <span 
          class="account-card-name"
          matTooltip="View profile"
          [routerLink]="['/profile', user?.id]"
          (click)="showAccountCard = false">
            {{ user?.name }}
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
