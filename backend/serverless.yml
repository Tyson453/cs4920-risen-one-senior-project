service: senior-project-template
frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs16.x
  region: us-east-2
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/users
            - arn:aws:dynamodb:${self:provider.region}:*:table/users/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/projects
            - arn:aws:dynamodb:${self:provider.region}:*:table/projects/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/dailyStatus
            - arn:aws:dynamodb:${self:provider.region}:*:table/dailyStatus/index/*

plugins:
  - serverless-dynamodb
  - serverless-offline

custom:
  dynamodb:
    stages:
      - dev
    start:
      port: 8000
      inMemory: true
      migrate: true
      seed: false
    seed:
      domain:
        sources:
          - table: users
            sources: [./seeds/users.json]
          - table: projects
            sources: [./seeds/projects.json]
          - table: dailyStatus
            sources: [./seeds/dailyStatus.json]

resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          [
            { 'AttributeName': 'uuid', 'AttributeType': 'S' },
            { 'AttributeName': 'startDate', 'AttributeType': 'S' },
            { 'AttributeName': 'teamName', 'AttributeType': 'S' },
            { 'AttributeName': 'username', 'AttributeType': 'S' },
          ]
        KeySchema: [{ 'AttributeName': 'uuid', 'KeyType': 'HASH' }]
        GlobalSecondaryIndexes:
          [
            {
              'IndexName': 'StartDateIndex',
              'KeySchema': [{ 'AttributeName': 'startDate', 'KeyType': 'HASH' }],
              'Projection': { 'ProjectionType': 'ALL' },
            },
            {
              'IndexName': 'TeamNameIndex',
              'KeySchema': [{ 'AttributeName': 'teamName', 'KeyType': 'HASH' }],
              'Projection': { 'ProjectionType': 'ALL' },
            },
            {
              'IndexName': 'UsernameIndex',
              'KeySchema': [{ 'AttributeName': 'username', 'KeyType': 'HASH' }],
              'Projection': { 'ProjectionType': 'ALL' },
            }
          ]
        BillingMode: PAY_PER_REQUEST
        TableName: users
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
    ProjectsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions: [{ 'AttributeName': 'uuid', 'AttributeType': 'S' }]
        KeySchema: [{ 'AttributeName': 'uuid', 'KeyType': 'HASH' }]
        BillingMode: PAY_PER_REQUEST
        TableName: projects
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
    DailyStatusTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          [
            { 'AttributeName': 'uuid', 'AttributeType': 'S' },
            { 'AttributeName': 'userId', 'AttributeType': 'S' },
            { 'AttributeName': 'date', 'AttributeType': 'S' }
          ]
        KeySchema: [{ 'AttributeName': 'uuid', 'KeyType': 'HASH' }]
        GlobalSecondaryIndexes:
          [
            {
              'IndexName': 'userDateIndex',
              'KeySchema': [{ 'AttributeName': 'userId', 'KeyType': 'HASH' }, { 'AttributeName': 'date', 'KeyType': 'RANGE' }],
              'Projection': { 'ProjectionType': 'ALL' },
            },
            {
              'IndexName': 'dateIndex',
              'KeySchema': [{ 'AttributeName': 'date', 'KeyType': 'HASH' }],
              'Projection': { 'ProjectionType': 'ALL' },
            }
          ]
        BillingMode: PAY_PER_REQUEST
        TableName: dailyStatus
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES

functions:
  login:
    handler: src/handlers/login.handler
    environment:
      USERS_TABLE: users
      JWT_SECRET: ${env:JWT_SECRET, 'dev-secret-change-in-production'}
      DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
    events:
      - http:
          path: login
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true

  importData:
    handler: src/handlers/import-data.handler
    environment:
      USERS_TABLE: users
      PROJECTS_TABLE: projects
      DAILY_STATUS_TABLE: dailyStatus
      DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
    events:
      - http:
          path: import-data
          method: post
          cors: true

  createUser:
    handler: src/handlers/create-user.handler
    environment:
      USERS_TABLE: users
      PROJECTS_TABLE: projects
      DAILY_STATUS_TABLE: dailyStatus
    events:
      - http:
          path: create-user
          method: post
          cors: true

  getTeamsAdmin:
    handler: src/handlers/get-teams-admin.handler
    environment:
      USERS_TABLE: users
      DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
    events:
      - http:
          path: teams/admin
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true

  getTeammates:
    handler: src/handlers/get-teammates.handler
    environment:
      USERS_TABLE: users
      DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
    events:
      - http:
          path: teams/teammates
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true

  getUser:
    handler: src/handlers/get-user.handler
    environment:
      USERS_TABLE: users
      DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
    events:
      - http:
          path: users/{uuid}
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true

  getUsers:
    handler: src/handlers/get-users.handler
    environment:
      USERS_TABLE: users
      DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
    events:
      - http:
          path: users
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true

  getProjects:
    handler: src/handlers/get-projects.handler
    environment:
      PROJECTS_TABLE: projects
      DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
    events:
      - http:
          path: projects
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true
