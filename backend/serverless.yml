service: senior-project-template
frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs16.x
  region: us-east-2
  apiGateway:
    gatewayResponses:
      DEFAULT_4XX:
        statusCode: 401
        responseHeaders:
          Access-Control-Allow-Origin: "'*'"
          Access-Control-Allow-Credentials: "true"
      DEFAULT_5XX:
        statusCode: 500
        responseHeaders:
          Access-Control-Allow-Origin: "'*'"
          Access-Control-Allow-Credentials: "true"

  environment:
    TRAININGS_TABLE: trainings
    CERTIFICATIONS_TABLE: certifications

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/users
            - arn:aws:dynamodb:${self:provider.region}:*:table/users/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/projects
            - arn:aws:dynamodb:${self:provider.region}:*:table/projects/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/dailyStatus
            - arn:aws:dynamodb:${self:provider.region}:*:table/dailyStatus/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/teams
            - arn:aws:dynamodb:${self:provider.region}:*:table/teams/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/personalDevelopmentTraining
            - arn:aws:dynamodb:${self:provider.region}:*:table/personalDevelopmentTraining/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/trainings
            - arn:aws:dynamodb:${self:provider.region}:*:table/trainings/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/certifications
            - arn:aws:dynamodb:${self:provider.region}:*:table/certifications/index/*
        - Effect: Allow
          Action:
            - dynamodb:ConditionCheckItem
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/teams
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: '*'

plugins:
  - serverless-dynamodb
  - serverless-offline

custom:
  dynamodb:
    stages:
      - dev
    start:
      port: 8000
      inMemory: false
      dbPath: .dynamodb
      migrate: true
      seed: false
    seed:
      domain:
        sources:
          - table: users
            sources: [./seeds/users.json]
          - table: projects
            sources: [./seeds/projects.json]
          - table: dailyStatus
            sources: [./seeds/dailyStatus.json]

resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          [
            { 'AttributeName': 'uuid', 'AttributeType': 'S' },
            { 'AttributeName': 'startDate', 'AttributeType': 'S' },
            { 'AttributeName': 'teamName', 'AttributeType': 'S' },
            { 'AttributeName': 'username', 'AttributeType': 'S' },
          ]
        KeySchema: [{ 'AttributeName': 'uuid', 'KeyType': 'HASH' }]
        GlobalSecondaryIndexes:
          [
            {
              'IndexName': 'StartDateIndex',
              'KeySchema': [{ 'AttributeName': 'startDate', 'KeyType': 'HASH' }],
              'Projection': { 'ProjectionType': 'ALL' },
            },
            {
              'IndexName': 'TeamNameIndex',
              'KeySchema': [{ 'AttributeName': 'teamName', 'KeyType': 'HASH' }],
              'Projection': { 'ProjectionType': 'ALL' },
            },
            {
              'IndexName': 'UsernameIndex',
              'KeySchema': [{ 'AttributeName': 'username', 'KeyType': 'HASH' }],
              'Projection': { 'ProjectionType': 'ALL' },
            }
          ]
        BillingMode: PAY_PER_REQUEST
        TableName: users
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
    ProjectsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions: [{ 'AttributeName': 'uuid', 'AttributeType': 'S' }]
        KeySchema: [{ 'AttributeName': 'uuid', 'KeyType': 'HASH' }]
        BillingMode: PAY_PER_REQUEST
        TableName: projects
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
    DailyStatusTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          [
            { 'AttributeName': 'uuid', 'AttributeType': 'S' },
            { 'AttributeName': 'userId', 'AttributeType': 'S' },
            { 'AttributeName': 'date', 'AttributeType': 'S' }
          ]
        KeySchema: [{ 'AttributeName': 'uuid', 'KeyType': 'HASH' }]
        GlobalSecondaryIndexes:
          [
            {
              'IndexName': 'userDateIndex',
              'KeySchema': [{ 'AttributeName': 'userId', 'KeyType': 'HASH' }, { 'AttributeName': 'date', 'KeyType': 'RANGE' }],
              'Projection': { 'ProjectionType': 'ALL' },
            },
            {
              'IndexName': 'dateIndex',
              'KeySchema': [{ 'AttributeName': 'date', 'KeyType': 'HASH' }],
              'Projection': { 'ProjectionType': 'ALL' },
            }
          ]
        BillingMode: PAY_PER_REQUEST
        TableName: dailyStatus
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
    TeamsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - { 'AttributeName': 'type', 'AttributeType': 'S' }
          - { 'AttributeName': 'teamName', 'AttributeType': 'S' }
        KeySchema:
          - { 'AttributeName': 'type', 'KeyType': 'HASH' }
          - { 'AttributeName': 'teamName', 'KeyType': 'RANGE' }
        BillingMode: PAY_PER_REQUEST
        TableName: teams
    PersonalDevelopmentTrainingTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - { 'AttributeName': 'pdtId', 'AttributeType': 'S' }
          - { 'AttributeName': 'userId', 'AttributeType': 'S' }
        KeySchema:
          - { 'AttributeName': 'pdtId', 'KeyType': 'HASH' }
        GlobalSecondaryIndexes:
          - IndexName: UserIdIndex
            KeySchema:
              - { 'AttributeName': 'userId', 'KeyType': 'HASH' }
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST
        TableName: personalDevelopmentTraining
    TrainingsTable:

      Type: AWS::DynamoDB::Table
      Properties:
        TableName: trainings
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: uuid
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: uuid
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: userIdIndex
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    CertificationsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: certifications
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: uuid
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: uuid
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: userIdIndex
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
            Projection:
              ProjectionType: ALL

functions:
  login:
    handler: src/handlers/login.handler
    environment:
      USERS_TABLE: users
      JWT_SECRET: ${env:JWT_SECRET, 'dev-secret-change-in-production'}
      DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
    events:
      - http:
          path: login
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true
  createTraining:
    handler: src/handlers/create-training.handler
    events:
      - http:
          path: trainings
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true
          authorizer: jwtAuthorizer

  getTrainings:
    handler: src/handlers/get-trainings.handler
    events:
      - http:
          path: trainings/{userId}
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true
          authorizer: jwtAuthorizer

  createCertification:
    handler: src/handlers/create-certification.handler
    events:
      - http:
          path: certifications
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true
          authorizer: jwtAuthorizer

  getCertifications:
    handler: src/handlers/get-certifications.handler
    events:
      - http:
          path: certifications/{userId}
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true
          authorizer: jwtAuthorizer
  jwtAuthorizer:
    handler: src/authorizers/authorizer.handler
    environment:
      JWT_SECRET: ${env:JWT_SECRET, 'dev-secret-change-in-production'}

  adminJwtAuthorizer:
    handler: src/authorizers/admin-authorizer.handler
    environment:
      JWT_SECRET: ${env:JWT_SECRET, 'dev-secret-change-in-production'}

  importData:
    handler: src/handlers/import-data.handler
    environment:
      USERS_TABLE: users
      PROJECTS_TABLE: projects
      DAILY_STATUS_TABLE: dailyStatus
      DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
    events:
      - http:
          path: import-data
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true

  createUser:
    handler: src/handlers/create-user.handler
    environment:
      USERS_TABLE: users
      PROJECTS_TABLE: projects
      DAILY_STATUS_TABLE: dailyStatus
      APP_BASE_URL: ${env:APP_BASE_URL, 'http://localhost:4200'}
      DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
      SEND_ONBOARDING_EMAIL: 'true'
      SES_FROM_EMAIL: ${env:SES_FROM_EMAIL, 'noreply@example.com'}
      ALLOW_SEND_EMAIL_LOCAL: ${env:ALLOW_SEND_EMAIL_LOCAL, ''}
    events:
      - http:
          path: create-user
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true
          authorizer: adminJwtAuthorizer

  resendOnboardingEmail:
    handler: src/handlers/resend-onboarding-email.handler
    environment:
      USERS_TABLE: users
      APP_BASE_URL: ${env:APP_BASE_URL, 'http://localhost:4200'}
      DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
      SEND_ONBOARDING_EMAIL: 'true'
      SES_FROM_EMAIL: ${env:SES_FROM_EMAIL, 'noreply@example.com'}
      ALLOW_SEND_EMAIL_LOCAL: ${env:ALLOW_SEND_EMAIL_LOCAL, ''}
    events:
      - http:
          path: users/{uuid}/resend-onboarding-email
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true
          authorizer: adminJwtAuthorizer

  setPassword:
    handler: src/handlers/set-password.handler
    environment:
      USERS_TABLE: users
      DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
    events:
      - http:
          path: set-password
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true
          authorizer: jwtAuthorizer

  getTeamsAdmin:
    handler: src/handlers/get-teams-admin.handler
    environment:
      USERS_TABLE: users
      TEAMS_TABLE: teams
      DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
    events:
      - http:
          path: teams/admin
          method: get
          authorizer: adminJwtAuthorizer
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true

  getTeammates:
    handler: src/handlers/get-teammates.handler
    environment:
      USERS_TABLE: users
      DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
    events:
      - http:
          path: teams/teammates
          method: get
          authorizer: jwtAuthorizer
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true

  getUser:
    handler: src/handlers/get-user.handler
    environment:
      USERS_TABLE: users
      DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
    events:
      - http:
          path: users/{uuid}
          method: get
          authorizer: jwtAuthorizer
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true

  updateUser:
    handler: src/handlers/update-user.handler
    environment:
      USERS_TABLE: users
      DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
    events:
      - http:
          path: users/{uuid}
          method: put
          authorizer: adminJwtAuthorizer
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true

  getUsers:
    handler: src/handlers/get-users.handler
    environment:
      USERS_TABLE: users
      DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
    events:
      - http:
          path: users
          method: get
          authorizer: jwtAuthorizer
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true

  getProjects:
    handler: src/handlers/get-projects.handler
    environment:
      PROJECTS_TABLE: projects
      DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
    events:
      - http:
          path: projects
          method: get
          authorizer: jwtAuthorizer
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true

  # ── Team management ──────────────────────────────────────────────────────────

  createTeam:
    handler: src/handlers/create-team.handler
    environment:
      USERS_TABLE: users
      TEAMS_TABLE: teams
      DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
    events:
      - http:
          path: teams
          method: post
          authorizer: adminJwtAuthorizer
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true

  updateTeam:
    handler: src/handlers/update-team.handler
    environment:
      USERS_TABLE: users
      TEAMS_TABLE: teams
      DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
    events:
      - http:
          path: teams/{type}/{teamName}
          method: put
          authorizer: adminJwtAuthorizer
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true

  deleteTeam:
    handler: src/handlers/delete-team.handler
    environment:
      USERS_TABLE: users
      TEAMS_TABLE: teams
      DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
    events:
      - http:
          path: teams/{type}/{teamName}
          method: delete
          authorizer: adminJwtAuthorizer
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true

  # ── Daily Status (DSU) ───────────────────────────────────────────────────────

  getDailyStatus:
    handler: src/handlers/get-daily-status.handler
    environment:
      DAILY_STATUS_TABLE: dailyStatus
      DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
    events:
      - http:
          path: daily-status
          method: get
          authorizer: jwtAuthorizer
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true

  upsertDailyReport:
    handler: src/handlers/upsert-daily-report.handler
    environment:
      DAILY_STATUS_TABLE: dailyStatus
      DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
    events:
      - http:
          path: daily-report/{userId}/{date}
          method: put
          authorizer: jwtAuthorizer
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true

  deleteDailyReport:
    handler: src/handlers/delete-daily-report.handler
    environment:
      DAILY_STATUS_TABLE: dailyStatus
      DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
    events:
      - http:
          path: daily-report/{userId}/{date}
          method: delete
          authorizer: jwtAuthorizer
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true

  sendMonthlyDailyStatus:
    handler: src/handlers/send-monthly-daily-status.handler
    environment:
      DAILY_STATUS_TABLE: dailyStatus
      USERS_TABLE: users
      DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
    events:
      - http:
          path: daily-status/monthly-email
          method: post
          authorizer: jwtAuthorizer
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true

  sendDailyStatusEmail:
    handler: src/handlers/send-daily-status-email.handler
    environment:
      USERS_TABLE: users
      DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
    events:
      - http:
          path: daily-status/send-report-email
          method: post
          authorizer: jwtAuthorizer
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true

  assignTeamMember:
    handler: src/handlers/assign-team-member.handler
    environment:
      USERS_TABLE: users
      DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
    events:
      - http:
          path: teams/{type}/{teamName}/members
          method: post
          authorizer: adminJwtAuthorizer
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true

  deleteUser:
    handler: src/handlers/delete-user.handler
    environment:
      USERS_TABLE: users
      TEAMS_TABLE: teams
      DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
    events:
      - http:
          path: users/{uuid}
          method: delete
          authorizer: adminJwtAuthorizer
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true

  removeTeamMember:
    handler: src/handlers/remove-team-member.handler
    environment:
      USERS_TABLE: users
      DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
    events:
      - http:
          path: teams/{type}/{teamName}/members/{uuid}
          method: delete
          authorizer: adminJwtAuthorizer
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true

  # ── Personal Development Training (PDT) ──────────────────────────────────────

  getPDTRecords:
    handler: src/handlers/get-pdt-records.handler
    environment:
      PDT_TABLE: personalDevelopmentTraining
      DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
    events:
      - http:
          path: pdt/user/{userId}
          method: get
          authorizer: jwtAuthorizer
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true

  createPDT:
    handler: src/handlers/create-pdt.handler
    environment:
      PDT_TABLE: personalDevelopmentTraining
      DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
    events:
      - http:
          path: pdt
          method: post
          authorizer: jwtAuthorizer
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true

  updatePDT:
    handler: src/handlers/update-pdt.handler
    environment:
      PDT_TABLE: personalDevelopmentTraining
      DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
    events:
      - http:
          path: pdt/{pdtId}
          method: put
          authorizer: jwtAuthorizer
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: true

  deletePDT:
    handler: src/handlers/delete-pdt.handler
    environment:
      PDT_TABLE: personalDevelopmentTraining
      DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
    events:
      - http:
          path: pdt/{pdtId}
          method: delete
          authorizer: jwtAuthorizer
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
